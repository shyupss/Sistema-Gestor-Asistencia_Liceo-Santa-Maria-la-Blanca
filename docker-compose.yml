services:
  grupo7_db:
    image: postgres:15-alpine
    env_file:
      - .env
    # persistencia de datos
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    # saber si el servicio está realmente funcionando (no solo corriendo)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  grupo7_frontend:
    build: 
      context: ./asistencia_lsmb  # contruir esta imagen a partir de esta ruta
      dockerfile: dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    # agregado para poder desarrollar en docker
    volumes: 
      - ./asistencia_lsmb:/app
      - /app/.venv # utiliza el venv que creó (ya no se copia desde los archivos)
    env_file:
      - .env
    depends_on:
      grupo7_db:
        condition: service_healthy
    # ========================================================================================
    # SI SE QUIERE SIMULAR PRODUCCION:
    # 1. Comentar el command en docker-compose.yml
    # 2. Dejar DEBUG vacío en .env
    # 3. Recrear los contenedores: docker compose up --build --force-recreate
    # ========================================================================================
    # command:
    #   sh -c "uv run manage.py runserver 0.0.0.0:${APP_PORT}"

volumes:
  postgres_data:

# ================================================================
# Este archivo es SOLO para desarrollo local.
# Para producción se usa docker-compose.server.yml (ver deploy.sh),
# que ya tiene la red red_taller_software configurada como externa.
# ================================================================