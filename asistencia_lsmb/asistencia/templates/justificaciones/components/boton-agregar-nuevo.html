<div class="relative w-full lg:w-auto" x-data="{ open: false }" @keydown.escape.window="open = false">
    <!-- Fondo oscurecido para mobile -->
    <div x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="open = false"
        class="fixed inset-0 z-40 bg-black/5 lg:hidden"
        x-cloak
    ></div>

    <!-- Botón desktop -->
    <button type="button"
        @click="open = !open"
        :aria-expanded="open"
        class="relative z-50 flex w-full items-center justify-center gap-1.5 rounded-lg
        bg-azul px-3 py-2.5 lg:py-1 text-sm shadow-sm font-semibold text-blanco 
        transition-colors hover:bg-azul-profundo lg:w-auto"
    >
        <i data-lucide="plus" 
            class="h-7 w-7 transition-transform duration-200"
            :class="{ 'rotate-45': open }"
        ></i>
        Añadir nuevo registro
    </button>

    <!-- Menú desktop -->
    <div x-show="open"
        x-transition:enter="transition ease-out duration-150"
        x-transition:enter-start="opacity-0 scale-95 -translate-y-1"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-100"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 -translate-y-1"
        @click.outside="open = false"
        @click="open = false"
        class="hidden absolute right-0 top-full z-50 mt-2 w-50 origin-top-right 
        divide-y divide-gris-claro overflow-hidden rounded-lg border border-gris-claro
        bg-blanco-tarjeta shadow-lg lg:block"
        x-cloak
    >
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm text-negro-texto transition-colors hover:bg-celeste-claro">
            <span class="flex items-center justify-center bg-azul-fondo p-3 rounded-full">
                <i data-lucide="square-pen" class="h-4 w-4 text-azul-profundo"></i>
            </span>
            Nueva justificación
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-sm text-negro-texto transition-colors hover:bg-celeste-claro">
            <span class="flex items-center justify-center bg-azul-fondo p-3 rounded-full">
                <i data-lucide="file-text" class="h-4 w-4 text-azul-profundo"></i>
            </span>
            Nuevo retiro de estudiante
        </a>
    </div>
    
    <!-- Menú mobile -->
    <div class="absolute inset-x-0 top-full z-50 mt-2 space-y-1 lg:hidden">
        <div x-show="open"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 -translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-2"
            @click="open = false"
            x-cloak
        >
            <a href="#" class="flex w-full items-center gap-3 rounded-lg border border-gris-claro bg-blanco px-4 py-3 text-sm font-medium text-negro-texto shadow-md">
                <span class="flex items-center justify-center bg-azul-fondo p-3 rounded-full">
                    <i data-lucide="square-pen" class="h-4 w-4 text-azul-profundo"></i>
                </span>
                Nueva justificación
            </a>
        </div>
        <div x-show="open"
            x-transition:enter="transition ease-out duration-200 delay-150"
            x-transition:enter-start="opacity-0 -translate-y-2"
            x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 -translate-y-2"
            @click="open = false"
            x-cloak
        >
            <a href="#" class="flex w-full items-center gap-3 rounded-lg border border-gris-claro bg-blanco px-4 py-3 text-sm font-medium text-negro-texto shadow-md">
                <span class="flex items-center justify-center bg-azul-fondo p-3 rounded-full">
                    <i data-lucide="file-text" class="h-4 w-4 text-azul-profundo"></i>
                </span>
                Nuevo retiro de estudiante
            </a>
        </div>
    </div>
</div>
