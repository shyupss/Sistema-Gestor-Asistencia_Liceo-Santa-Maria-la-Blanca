{% comment %}
Requiere:
- estado
{% endcomment %}

<span class="inline-flex shrink-0 items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold
    {% if estado == 'pendiente' %}bg-azul-fondo text-azul-profundo
    {% elif estado == 'aceptada' %}bg-verde-fondo text-verde-oscuro
    {% elif estado == 'rechazada' %}bg-rojo-fondo text-rojo-oscuro
    {% else %}bg-gris-claro text-gris-texto
    {% endif %}">
    <i data-lucide="{% if estado == 'pendiente' %}clock
        {% elif estado == 'aceptada' %}circle-check
        {% elif estado == 'rechazada' %}circle-x
        {% else %}circle-alert
        {% endif %}" class="h-3 w-3"></i>
    {{ estado|capfirst|default:"Sin estado" }}
</span>
