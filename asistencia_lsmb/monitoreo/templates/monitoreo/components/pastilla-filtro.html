{% endcomment %}
<button type="button"
    @click="$store.filtros.fijarGlobal('{{ tipo }}', '{{ valor }}')"
    aria-pressed="{% if activo %}true{% else %}false{% endif %}"
    class="rounded-full border px-2.5 py-0.5 text-xs transition-colors
    {% if activo %}border-azul bg-azul-fondo font-semibold text-azul
    {% else %}border-gris-claro bg-blanco text-gris-texto hover:border-azul-medio hover:text-azul
    {% endif %}"
>
    {{ texto }}
</button>
