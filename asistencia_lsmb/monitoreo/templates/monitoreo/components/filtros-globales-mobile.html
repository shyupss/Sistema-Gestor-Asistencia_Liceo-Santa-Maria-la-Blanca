<div class="mt-2 flex justify-end lg:hidden" x-data>
    <button type="button" @click="$store.filtros.sheetAbierto = true"
        aria-haspopup="dialog"
        class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-medium transition-colors"
        :class="$store.filtros.cantidadGlobal ? 'border-azul bg-azul-claro text-azul' : 'border-gris-claro bg-blanco-tarjeta text-gris-texto'"
    >
        <i data-lucide="sliders-horizontal" class="h-3.5 w-3.5"></i>
        Filtros
        <span x-show="$store.filtros.cantidadGlobal" x-text="$store.filtros.cantidadGlobal" x-cloak
            class="flex h-4 min-w-[1rem] items-center justify-center rounded-full bg-azul px-1 text-[10px] font-semibold text-blanco"
        ></span>
    </button>
</div>
 
<div class="lg:hidden" x-data @keydown.escape.window="$store.filtros.sheetAbierto = false">
    <div x-show="$store.filtros.sheetAbierto" x-cloak x-transition.opacity.duration.200ms
        @click="$store.filtros.sheetAbierto = false"
        class="fixed inset-0 z-[60] bg-negro-texto/40"
    ></div>
 
    <div x-show="$store.filtros.sheetAbierto" x-cloak
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="translate-y-full"
        x-transition:enter-end="translate-y-0"
        x-transition:leave="transition ease-in duration-150"
        x-transition:leave-start="translate-y-0"
        x-transition:leave-end="translate-y-full"
        role="dialog" aria-modal="true" aria-label="Filtros del dashboard"
        class="fixed inset-x-0 bottom-0 z-[61] max-h-[85vh] overflow-y-auto rounded-t-2xl bg-blanco-tarjeta p-4 shadow-xl"
    >
        <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-gris-claro"></div>
        <div class="mb-3 flex items-center justify-between">
            <p class="text-base font-semibold text-azul">Filtros</p>
            <button type="button" @click="$store.filtros.sheetAbierto = false" aria-label="Cerrar filtros"
                class="rounded-lg p-1 text-gris-texto transition-colors hover:bg-blanco-fondo"
            >
                <i data-lucide="x" class="h-5 w-5"></i>
            </button>
        </div>
        {% include 'monitoreo/components/filtros-globales-desktop.html' with prefijo='m' %}
    </div>
</div>
