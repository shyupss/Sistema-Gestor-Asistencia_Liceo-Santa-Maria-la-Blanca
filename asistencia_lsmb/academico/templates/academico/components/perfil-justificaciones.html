<h2 class="mb-4 text-lg font-bold text-azul-profundo">Justificaciones</h2><div class="space-y-3">{% for item in justificaciones %}<article class="rounded-lg border border-gris-claro p-4"><div class="flex flex-wrap items-center justify-between gap-2"><p class="font-semibold text-negro-texto">{{ item.fecha_inicio|date:'d/m/Y' }} al {{ item.fecha_fin|date:'d/m/Y' }}</p><span class="rounded-full bg-azul-fondo px-2 py-1 text-xs font-semibold text-azul-profundo">{{ item.estado_solicitud.nombre }}</span></div><p class="mt-2 text-sm text-gris-texto">{{ item.motivo|default:'Sin motivo indicado' }}</p></article>{% empty %}<p class="text-sm text-gris-texto">No hay justificaciones registradas.</p>{% endfor %}</div>
