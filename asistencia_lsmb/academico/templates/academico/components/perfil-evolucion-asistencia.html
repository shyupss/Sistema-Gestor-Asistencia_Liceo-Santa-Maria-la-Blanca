<section class="mb-8 rounded-lg border border-gris-claro bg-blanco-tarjeta p-4 sm:p-6">
    <div class="mb-5 flex items-center justify-between gap-3">
        <div>
            <h2 class="text-base font-bold text-azul-profundo sm:text-lg">Evolución de la asistencia</h2>
            <p class="mt-1 text-xs text-gris-texto">Porcentaje mensual del período {{ fecha_hoy.year }}</p>
        </div>
        <span class="rounded-full bg-azul-fondo px-3 py-1 text-xs font-semibold text-azul-profundo">{{ fecha_hoy.year }}</span>
    </div>

    <div class="relative h-64 w-full">
        <div class="grid h-full grid-cols-[1.5rem_minmax(0,1fr)] gap-1 sm:grid-cols-[2rem_minmax(0,1fr)] sm:gap-2">
            <div class="relative">
                <span class="pointer-events-none absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-90 whitespace-nowrap text-[9px] font-semibold text-gris-texto sm:text-[10px]">Porcentaje de asistencia (%)</span>
            </div>
            <div class="relative min-w-0">
                <div class="pointer-events-none absolute left-0 top-2 bottom-10 w-8 text-right text-[10px] text-gris-texto">
                    <span class="absolute right-0 top-[10%] -translate-y-1/2">100%</span>
                    <span class="absolute right-0 top-[30%] -translate-y-1/2">75%</span>
                    <span class="absolute right-0 top-[50%] -translate-y-1/2">50%</span>
                    <span class="absolute right-0 top-[70%] -translate-y-1/2">25%</span>
                    <span class="absolute right-0 top-[90%] -translate-y-1/2">0%</span>
                </div>
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="absolute left-8 top-2 h-[calc(100%-3rem)] w-[calc(100%-2rem)] overflow-visible" role="img" aria-label="Evolución mensual de la asistencia">
                    <line x1="0" y1="10" x2="100" y2="10" stroke="#E5E7EB" stroke-dasharray="1 2" />
                    <line x1="0" y1="30" x2="100" y2="30" stroke="#E5E7EB" stroke-dasharray="1 2" />
                    <line x1="0" y1="50" x2="100" y2="50" stroke="#E5E7EB" stroke-dasharray="1 2" />
                    <line x1="0" y1="70" x2="100" y2="70" stroke="#E5E7EB" stroke-dasharray="1 2" />
                    <line x1="0" y1="90" x2="100" y2="90" stroke="#E5E7EB" stroke-dasharray="1 2" />
                    {% if puntos_grafico %}<polyline points="{{ puntos_grafico }}" fill="none" stroke="#1B5FA8" stroke-width="1.2" vector-effect="non-scaling-stroke" />{% endif %}
                    {% for mes in evolucion_mensual %}
                        {% if mes.porcentaje is not None %}<line x1="{{ mes.x }}" y1="{{ mes.y }}" x2="{{ mes.x }}" y2="{{ mes.y }}" stroke="#1B5FA8" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"><title>{{ mes.nombre }}: {{ mes.porcentaje }}%</title></line>{% endif %}
                    {% endfor %}
                </svg>
                <div class="absolute left-8 right-0 bottom-0 flex h-10 items-start justify-between text-[9px] text-gris-texto sm:h-6 sm:text-xs">
                    {% for mes in evolucion_mensual %}<span class="flex-1 origin-top -rotate-45 text-center sm:rotate-0">{{ mes.nombre }}</span>{% endfor %}
                </div>
            </div>
        </div>
    </div>
</section>
