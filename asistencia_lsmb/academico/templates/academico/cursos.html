{% extends 'base.html' %}

{% block title %}Pagina Primera{% endblock %}

{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md text-center">
    <!-- Imprimimos las variables que enviamos desde views.py -->
    <h1 class="text-3xl font-bold text-blue-600 mb-4">Prueba Lista Alumnos</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Periodo</th>
                <th>Profesor Jefe</th>
                <th>Nivel</th>
                <th>Grupo</th>
            </tr>
        </thead>
        <tbody>
            {% for curso in lista_cursos %}
            <tr>
                <td>{{ curso.periodo }}</td>
                <td>{{ curso.profesor_jefe }}</td>
                <td>{{ curso.nivel }}</td>
                <td>{{ curso.curso}}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p class="text-gray-700 mb-2"></p>
</div>
{% endblock %}
