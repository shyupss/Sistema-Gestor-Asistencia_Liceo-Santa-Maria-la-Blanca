{% load static %}
<header class="bg-azul-profundo text-blanco px-4 py-3 flex items-center justify-between shadow-md min-h-[15vh]">
    <!-- Lado izquierdo -->
    <div class="flex items-center space-x-3">
        <!-- Logo -->
        <img 
            src="{% static 'img/favicon.ico' %}" 
            alt="Logo Liceo Santa María la Blanca"
            class="w-16 h-16 md:w-20 md:h-20 object-contain rounded-full border-2 border-azul-medio"
        >
        <!-- Título -->
        <div class="flex flex-col">
            <h1 class="text-2xl font-serif font-semibold tracking-wide border-b border-blanco pb-1">
                <span class="md:hidden">LSMB</span>
                <span class="hidden md:inline">Liceo Santa María la Blanca</span>
            </h1>
            <p class="text-xs pt-1 md:text-sm text-blanco">
                <span class="md:hidden">Gestión asistencia</span>
                <span class="hidden md:inline">Sistema de gestión de asistencia y alertas tempranas</span>
            </p>
        </div>
    </div>

    <!-- Lado derecho -->
    <div class="flex items-center space-x-4 md:space-x-6">
        <!-- Notificaciones -->
        <button type="button" class="group relative p-1.5 text-blanco rounded-md hover:text-celeste-claro hover:bg-azul-primario/60 transition-colors
        transition-transform duration-200 ease-out hover:scale-105 origin-center active:scale-95" 
        aria-label="Notificaciones">
            <i data-lucide="bell" class="w-6 h-6 md:w-7 md:h-7"></i>
            <!-- Badge cantidad alertas -->
            <span class="absolute top-0 right-0 bg-rojo text-blanco text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center transition-colors">
                3 <!-- TODO: PENDIENTE HACER QUE CUENTE LA CANTIDAD DE ALERTAS -->
            </span>
        </button>
        <!-- Componente usuario -->
        <div class="group flex items-center space-x-3 bg-azul-profundo border border-azul-primario rounded-xl px-3 py-1.5 cursor-pointer hover:border-azul-medio transition-colors">
            <!-- Avatar -->
            <div class="w-9 h-9 md:w-10 md:h-10 rounded-full bg-azul-primario flex items-center justify-center font-bold text-sm text-blanco shrink-0">
                ADM <!-- TODO: CAMBIAR POR INICIALES DEL USUARIO -->
            </div>

            <!-- Información usuario -->
            <div class="hidden md:flex flex-col text-left pr-2">
                <span class="text-sm font-semibold leading-tight">
                    Grupo 7 <!-- TODO: REQUEST DEL NOMBRE DE USUARIO -->
                </span>
                <span class="text-xs font-semibold text-azul-claro leading-tight">
                    Administrador <!-- TODO: REQUEST DEL ROL DEL USUARIO -->
                </span>
            </div>

            <!-- Icono hamburguesa -->
            <i data-lucide="menu" class="w-6 h-6 text-blanco group-hover:text-azul-fondo transition-colors"></i>
        </div>
    </div>
</header>
