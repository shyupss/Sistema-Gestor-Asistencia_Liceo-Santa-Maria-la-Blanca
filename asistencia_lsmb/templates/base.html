<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio{% endblock %} · Liceo Santa María la Blanca</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak] { display: none !important; }</style>

    <!-- Paleta de colores -->
    <script src="{% static 'js/tailwind.config.js' %}"></script>

    <!-- Funciones útiles JS -->
    <script src="{% static 'js/estilos_archivos.js' %}"></script>

    <!-- Carga de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Flatpickr (Calendario en español) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <style>
        /* Estilos personalizados para Flatpickr adaptados al sistema */
        .flatpickr-calendar {
            font-family: 'Inter', sans-serif !important;
            border: 2px solid #1B5FA8 !important; /* Borde azul primario */
            border-radius: 0.75rem !important; /* rounded-xl */
            box-shadow: 0 10px 25px -5px rgba(27, 95, 168, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1) !important;
            overflow: hidden !important;
            background: #FFFFFF !important;
        }
        .flatpickr-calendar.arrowTop:before,
        .flatpickr-calendar.arrowTop:after {
            border-bottom-color: #1B5FA8 !important;
        }
        .flatpickr-calendar.arrowBottom:before,
        .flatpickr-calendar.arrowBottom:after {
            border-top-color: #1B5FA8 !important;
        }
        .flatpickr-months {
            background-color: #1B5FA8 !important;
            color: #FFFFFF !important;
            padding: 4px 0 !important;
        }
        .flatpickr-months .flatpickr-month {
            color: #FFFFFF !important;
            fill: #FFFFFF !important;
        }
        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month {
            color: #FFFFFF !important;
            fill: #FFFFFF !important;
        }
        .flatpickr-months .flatpickr-prev-month:hover svg,
        .flatpickr-months .flatpickr-next-month:hover svg {
            fill: #D4EAFF !important;
        }
        .flatpickr-current-month .flatpickr-monthDropdown-months {
            font-weight: 600 !important;
            color: #FFFFFF !important;
            background-color: #1B5FA8 !important;
        }
        .flatpickr-current-month input.cur-year {
            font-weight: 600 !important;
            color: #FFFFFF !important;
        }
        span.flatpickr-weekday {
            background: #F3F4F6 !important;
            color: #1F2937 !important;
            font-weight: 600 !important;
            font-size: 0.75rem !important;
        }
        .flatpickr-day {
            border-radius: 0.5rem !important; /* rounded-lg */
            color: #1F2937 !important;
            font-weight: 500 !important;
        }
        .flatpickr-day:hover {
            background-color: #D4EAFF !important;
            color: #0F3A66 !important;
        }
        .flatpickr-day.selected,
        .flatpickr-day.selected:hover {
            background-color: #1B5FA8 !important;
            color: #FFFFFF !important;
            border-color: #1B5FA8 !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.today {
            border-color: #1B5FA8 !important;
            color: #1B5FA8 !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.today:hover {
            background-color: #D4EAFF !important;
        }
    </style>
</head>

<body class="bg-blanco-fondo">

    {% include 'components/base/header.html' %}

    {% include 'components/base/navbar-desktop.html' %}

    <main class="pb-24 lg:pb-0">
        {% block content %}
        <!-- App content will load here -->
        {% endblock %}
    </main>

    {% include 'components/base/navbar-mobile.html' %}

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof flatpickr !== 'undefined') {
                flatpickr.localize(flatpickr.l10ns.es);
                flatpickr('.datepicker', {
                    dateFormat: 'Y-m-d',
                    altInput: true,
                    altFormat: 'd/m/Y',
                    locale: 'es'
                });
            }
        });
    </script>
</body>

</html>
