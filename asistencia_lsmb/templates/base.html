<!-- templates/base.html -->
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio{% endblock %}</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Paleta de colores -->
    <script src="{% static 'js/tailwind.config.js' %}"></script>
</head>
<body>
    <header>
        <div class="flex items-center justify-center min-h-[15vh] bg-azul-profundo">
            <h1 class="flex items-center gap-3 text-4xl font-bold text-white bg-white/10 backdrop-blur-sm px-8 py-6 rounded-2xl shadow-2xl border border-white/20">
                <span>¡Hola mundo! de parte del grupo 7</span>
                <i data-lucide="handshake" class="h-10 w-auto text-white shrink-0"></i>
            </h1>
        </div>
    </header>
    
    <main>
        {% block content %}
        <!-- App content will load here -->
        {% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
