<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Sitio{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header>
        <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-purple-500 to-blue-600">
            <h1 class="text-4xl font-bold text-white bg-white/10 backdrop-blur-sm px-8 py-6 rounded-2xl shadow-2xl border border-white/20">
                ¡Hola mundo! de parte del grupo 7
            </h1>
        </div>
    </header>
    
    <main>
        {% block content %}
        <!-- App content will load here -->
        {% endblock %}
    </main>
</body>
</html>
