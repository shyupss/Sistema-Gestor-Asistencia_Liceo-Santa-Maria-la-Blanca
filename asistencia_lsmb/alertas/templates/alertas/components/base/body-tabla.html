<div class="border-t border-b border-gris-claro bg-blanco-tarjeta">
    {% if page_obj %}
        <div class="grid grid-cols-1 gap-3 px-2 py-2.5 lg:grid-cols-3">
            {% for alerta in page_obj %}
                {% include 'alertas/components/base/tarjeta-alerta.html' with alerta=alerta %}
            {% endfor %}
        </div>
    {% else %}
        <div class="flex flex-col items-center gap-2 py-16 text-center text-gris-iconos">
            <i data-lucide="bell-off" class="h-8 w-8"></i>
            <p class="font-medium">No hay alertas que mostrar</p>
        </div>
    {% endif %}
</div>
